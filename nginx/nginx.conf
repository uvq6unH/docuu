events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    upstream game_server {
        server backend:3001;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Root directory of built frontend
        root /usr/share/nginx/html;
        index index.html;

        # Static assets with long-term caching
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Models, audio, textures
        location ~* \.(glb|gltf|bin|png|jpg|jpeg|svg|webp|mp3|ogg|wav)$ {
            expires 30d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # WebSocket Socket.IO reverse proxy
        location /socket.io/ {
            proxy_pass http://game_server/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # API & Health check reverse proxy
        location /api/ {
            proxy_pass http://game_server/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /healthz {
            proxy_pass http://game_server/healthz;
            proxy_set_header Host $host;
        }

        # Single-page application router fallback
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate";
        }
    }
}
